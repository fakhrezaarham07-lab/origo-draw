<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <!-- Mobile optimization -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="description"
    content="Origo Draw — Free digital drawing workspace for sketching, coloring, shading, perspective and creative artwork."
  >

  <meta name="theme-color" content="#0a0d12">

  <title>Origo Draw — Free Digital Drawing Studio</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- =====================================================
       APP HEADER
  ====================================================== -->
  <header class="app-header">

    <div class="brand">
      <div class="brand-logo" aria-hidden="true">
        OD
      </div>

      <div class="brand-text">
        <strong>Origo Draw</strong>
        <span>Create. Draw. Imagine.</span>
      </div>
    </div>

    <div class="header-actions">

      <button
        id="newCanvasBtn"
        class="header-btn"
        type="button"
        title="New Canvas"
      >
        ＋ New
      </button>

      <button
        id="undoBtn"
        class="header-btn icon-btn"
        type="button"
        title="Undo"
        aria-label="Undo"
      >
        ↶
      </button>

      <button
        id="redoBtn"
        class="header-btn icon-btn"
        type="button"
        title="Redo"
        aria-label="Redo"
      >
        ↷
      </button>

      <button
        id="saveBtn"
        class="header-btn"
        type="button"
        title="Save artwork"
      >
        Save
      </button>

      <button
        id="themeBtn"
        class="header-btn icon-btn"
        type="button"
        title="Toggle theme"
        aria-label="Toggle theme"
      >
        ☾
      </button>

    </div>

  </header>


  <!-- =====================================================
       MAIN APPLICATION
  ====================================================== -->
  <main class="app">

    <!-- ================================================
         LEFT TOOLBAR
    ================================================= -->
    <aside
      id="toolBar"
      class="toolbar"
      aria-label="Drawing tools"
    >

      <div class="toolbar-section">

        <button
          class="tool-btn active"
          data-tool="brush"
          type="button"
          title="Brush"
        >
          <span>🖌️</span>
          <small>Brush</small>
        </button>

        <button
          class="tool-btn"
          data-tool="pencil"
          type="button"
          title="Pencil"
        >
          <span>✏️</span>
          <small>Pencil</small>
        </button>

        <button
          class="tool-btn"
          data-tool="pen"
          type="button"
          title="Pen"
        >
          <span>🖊️</span>
          <small>Pen</small>
        </button>

        <button
          class="tool-btn"
          data-tool="marker"
          type="button"
          title="Marker"
        >
          <span>🖍️</span>
          <small>Marker</small>
        </button>

        <button
          class="tool-btn"
          data-tool="eraser"
          type="button"
          title="Eraser"
        >
          <span>⌫</span>
          <small>Eraser</small>
        </button>

      </div>


      <div class="toolbar-divider"></div>


      <div class="toolbar-section">

        <button
          class="tool-btn"
          data-tool="fill"
          type="button"
          title="Fill"
        >
          <span>🪣</span>
          <small>Fill</small>
        </button>

        <button
          class="tool-btn"
          data-tool="picker"
          type="button"
          title="Color Picker"
        >
          <span>🎨</span>
          <small>Picker</small>
        </button>

        <button
          class="tool-btn"
          data-tool="line"
          type="button"
          title="Line"
        >
          <span>╱</span>
          <small>Line</small>
        </button>

        <button
          class="tool-btn"
          data-tool="rectangle"
          type="button"
          title="Rectangle"
        >
          <span>□</span>
          <small>Rect</small>
        </button>

        <button
          class="tool-btn"
          data-tool="circle"
          type="button"
          title="Circle"
        >
          <span>○</span>
          <small>Circle</small>
        </button>

      </div>


      <div class="toolbar-divider"></div>


      <div class="toolbar-section">
